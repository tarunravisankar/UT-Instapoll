<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UT Instapoll</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/icon48.png" alt=""><div><h1>UT Instapoll <small>v1.3.0</small></h1><p>Questions and answers, right here.</p></div></header>
  <div class="status"><span id="dot" class="dot"></span><span id="statusLabel">Connecting…</span></div>
  <label class="course-label" for="course">Course</label>
  <select id="course"></select>
  <div class="row"><button id="refresh">Refresh polls</button><button id="open">Open course page</button></div>
  <p id="message" role="status" aria-live="polite">Loading courses…</p>
  <main id="polls"></main>
  <footer>
    <p>Keep your signed-in student course tab open. Answers are sent only when you click Submit.</p>
    <div class="row"><button id="test">Send test alert</button><button id="reconnect">Reconnect alerts</button></div>
  </footer>
  <script src="poll-model.js"></script>
  <script src="popup.js"></script>
</body>
</html>
